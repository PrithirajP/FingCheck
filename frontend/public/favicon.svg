<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Circle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Biometric Fingerprint Arcs & Ridges -->
  <g stroke="url(#fingerGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)">
    <!-- Center Core Loop -->
    <path d="M256 160 C 230 160, 216 185, 216 220 L 216 300 C 216 335, 240 352, 256 352 C 272 352, 296 335, 296 300 L 296 240" />
    <path d="M256 200 C 244 200, 236 212, 236 230 L 236 290 C 236 308, 246 318, 256 318 C 266 318, 276 308, 276 290 L 276 260" />
    
    <!-- Outer Ridge Loop 1 -->
    <path d="M256 120 C 200 120, 176 160, 176 220 L 176 320 C 176 370, 216 392, 256 392 C 296 392, 336 370, 336 320 L 336 220 C 336 160, 312 120, 256 120 Z" />
    
    <!-- Outer Ridge Loop 2 -->
    <path d="M256 80 C 170 80, 136 135, 136 220 L 136 330 C 136 395, 185 432, 256 432 C 327 432, 376 395, 376 330 L 376 220 C 376 135, 342 80, 256 80 Z" />
    
    <!-- Fine Ridges -->
    <path d="M196 390 C 214 406, 235 412, 256 412 C 277 412, 298 406, 316 390" />
  </g>

  <!-- Laser Scan Reticle Line -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="url(#laserGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#glow)"/>
</svg>